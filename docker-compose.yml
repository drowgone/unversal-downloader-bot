services:
  bot:
    build: .
    command: python -m app.main
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
    restart: always

  worker_media:
    build: .
    command: celery -A app.workers.celery_app worker -Q media --loglevel=info -c 4
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    restart: always

  worker_playlists:
    build: .
    command: celery -A app.workers.celery_app worker -Q playlists --loglevel=info -c 2
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    restart: always

  beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: always

  flower:
    image: mher/flower:latest
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=${REDIS_URL}
    depends_on:
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio

volumes:
  postgres_data:
  minio_data:
